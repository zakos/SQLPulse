name: Integration

# The JDBC layer against real servers. Everything else in CI runs without a database: these are
# the tests that can tell us the app's SQL is right rather than merely well-formed.
#
# The same tests live in the ordinary unit test source set and are skipped there — they ask the
# environment for a server and, finding none, assume themselves away. That is why check.yml is
# unaffected by them and why this workflow exists: here the server is provided.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # Three servers, because the app supports three: the modern driver against MySQL 8, the old
    # one against the sort of server it exists for, and MariaDB, which is what the modern driver
    # is actually written for.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # One server failing says something about that server, not about the others, so the rest of
      # the matrix is allowed to finish and report.
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            health: --health-cmd="mysqladmin ping -uroot -psqlpulse --silent" --health-interval=10s --health-timeout=5s --health-retries=20
            # MySQL 8 authenticates with caching_sha2_password, which the 2019 driver cannot do.
            # The fallback test skips itself rather than pretending that is a failure.
            legacy: 'false'
          - name: MySQL 5.7
            image: mysql:5.7
            health: --health-cmd="mysqladmin ping -uroot -psqlpulse --silent" --health-interval=10s --health-timeout=5s --health-retries=20
            legacy: 'true'
          - name: MariaDB 11
            image: mariadb:11
            # MariaDB 11 ships its own health script; mysqladmin is only a deprecated symlink.
            health: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=20
            legacy: 'true'

    services:
      db:
        image: ${{ matrix.image }}
        env:
          # MariaDB's image still honours the MYSQL_ prefixed variables, so one set covers all
          # three images.
          MYSQL_ROOT_PASSWORD: sqlpulse
          MYSQL_DATABASE: sqlpulse_test
        ports:
          - 3306:3306
        # The job does not start until the server answers; without this the first test would race
        # the server's own initialisation and fail on a connection refused.
        #
        # The MySQL images need the password in the health command: root has one, and
        # `mysqladmin ping` without it is answered with "access denied" until the retries run out
        # — the server is up the whole time and the job never gets to start. MariaDB's own
        # healthcheck.sh reads the container's environment itself and needs no credentials.
        options: ${{ matrix.health }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' because the action's default list still contains the retired "tools"
      # package, which sdkmanager now refuses. The runner image already ships platform-tools.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Only the integration package: the rest of the unit tests are check.yml's job, and running
      # them again here would say nothing new about the server.
      - name: Integration tests
        env:
          SQLPULSE_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/sqlpulse_test
          SQLPULSE_TEST_MYSQL_USER: root
          SQLPULSE_TEST_MYSQL_PASSWORD: sqlpulse
          SQLPULSE_TEST_MYSQL_LEGACY: ${{ matrix.legacy }}
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'hu.laurel.sqlpulse.integration.*'

      # The messages, last, where they can be read.
      #
      # Gradle prints them where it runs, but GitHub dumps the whole service container's log after
      # the job — a hundred lines of InnoDB starting up — and that is what is left at the end of
      # the log. The report is also uploaded as an artifact, which is the better copy; this is for
      # reading the failure without downloading anything.
      - name: Say what failed
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import glob
          import xml.etree.ElementTree as ET

          shown = 0
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.iter("failure")) + list(case.iter("error")):
                      shown += 1
                      if shown > 12:
                          continue
                      print(f"--- {case.get('classname')} > {case.get('name')}")
                      print((problem.get("message") or "no message").strip()[:600])
                      print()
          print(f"{shown} failing tests in total.")
          PYTHON

      # A skipped test here would mean the server was never reached, which is exactly the failure
      # this workflow exists to catch — so the report is kept whatever the outcome.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-${{ strategy.job-index }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    # The PostgreSQL dialect against a real server (data/sql/dialect/PostgresDialect.kt). Its own
    # job, because the MySQL matrix above is one service container per run and none of it applies
    # here. The MySQL tests skip themselves with no SQLPULSE_TEST_MYSQL_URL, and these skip
    # themselves in the MySQL jobs for the same reason.
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sqlpulse
          POSTGRES_DB: sqlpulse_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Integration tests
        env:
          SQLPULSE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/sqlpulse_test
          SQLPULSE_TEST_POSTGRES_USER: postgres
          SQLPULSE_TEST_POSTGRES_PASSWORD: sqlpulse
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'hu.laurel.sqlpulse.integration.postgres.*'

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-postgres
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # SQL Server speaks another protocol and another SQL, so it has a job of its own instead of a
  # matrix row: the services block, the environment variables and the test package are all
  # different. The MySQL jobs above are not touched by it.
  sqlserver:
    name: SQL Server 2022
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Sqlpulse_Str0ng!Pw
        ports:
          - 1433:1433
        # sqlcmd 18 refuses an unverifiable certificate unless told -C; the container's own
        # is self-signed.
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Sqlpulse_Str0ng!Pw -Q 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The test creates its own database (sqlpulse_test) and its own schemas, and drops what it
      # made. Encryption is on and the certificate unchecked (the default of the test helper).
      - name: SQL Server integration tests
        env:
          SQLPULSE_TEST_MSSQL_URL: jdbc:sqlserver://127.0.0.1:1433/sqlpulse_test
          SQLPULSE_TEST_MSSQL_USER: sa
          SQLPULSE_TEST_MSSQL_PASSWORD: Sqlpulse_Str0ng!Pw
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'hu.laurel.sqlpulse.integration.sqlserver.*'

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-integration-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
