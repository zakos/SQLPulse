name: Instrumentation (manual)

# NOT PART OF THE ORDINARY CHECK RUN. The Compose UI tests in app/src/androidTest need an Android
# device; the hosted runners have no hardware acceleration worth the name, so an emulator run
# takes tens of minutes and is flaky in ways that say nothing about the change under test. Making
# that a required check would train everyone to re-run it until it goes green.
#
# So it is started by hand, from the Actions tab, when a screen has been worked on. check.yml
# stays what a pull request waits for.
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: The Android API level to run the tests on.
        required: false
        default: '34'
        type: choice
        options: ['28', '30', '34']

permissions:
  contents: read

concurrency:
  group: instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Compose UI tests on API ${{ inputs.api-level }}
    # An emulator needs KVM, which only the larger Linux images expose; the timeout is generous
    # because most of it is the emulator booting, not the tests running.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' because the action's default list still contains the retired "tools"
      # package, which sdkmanager now refuses. The runner image already ships platform-tools.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator is unusably slow without it, and the runner image ships it disabled for
      # everyone but root.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # This action boots the emulator, waits for it, runs the script and shuts it down. The
      # atd/google clock services are turned off because they wake the device mid-test.
      - name: Run the Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-report-api-${{ inputs.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Say what ran
        if: always()
        run: |
          {
            echo "### Compose UI tests on API ${{ inputs.api-level }}"
            echo
            echo "Started by hand: these are not part of the checks a pull request waits for."
            echo "The report is in the **instrumentation-report-api-${{ inputs.api-level }}** artifact."
          } >> "$GITHUB_STEP_SUMMARY"
