name: Security

# What the project depends on, looked at on every pull request: which dependencies the change
# adds or moves, and what is published against them.
#
# Nothing here blocks a merge. An advisory in a JDBC driver or in Bouncy Castle is usually not
# something the pull request in front of you can act on — the fix is a version bump, which is its
# own change — and a red check nobody can clear is a check people learn to ignore. So this
# reports and leaves the decision to a person.
on:
  pull_request:
  # On main only to keep the dependency graph up to date, which is what a pull request's
  # dependency review compares against.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a pull request has two sides to compare; a manual run has nothing to diff against.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      # For the summary comment the action leaves on the pull request.
      pull-requests: write

    # warn-only only covers what the review *finds*. Where the repository has no dependency graph
    # the action cannot run at all and exits with an error, which would put a red check on every
    # pull request until somebody turns the setting on — exactly the check people learn to ignore
    # that the note at the top of this file argues against. Enable it at
    # Settings → Code security → Dependency graph, and this job starts reporting for real.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Compares the dependencies of the base branch with this branch's and names what changed,
      # with any known advisory and the licence of each addition.
      #
      # warn-only keeps the job green whatever it finds — see the note at the top of the file.
      # It reads GitHub's dependency graph, which for Gradle exists only because the job below
      # submits a snapshot from main; until the first snapshot lands the action finds nothing to
      # compare and says so, rather than failing.
      - name: Review the dependency changes
        uses: actions/dependency-review-action@v4
        with:
          warn-only: true
          comment-summary-in-pr: on-failure
          # Below high, the noise costs more attention than the findings are worth here.
          fail-on-severity: high

  dependency-graph:
    name: Submit the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Main only: a snapshot is the record of what the released app depends on, and submitting one
    # per pull request would make the graph flap. A fork's pull request could not write it anyway.
    if: github.event_name == 'push'

    # Submitting a snapshot needs the repository's dependency graph to be switched on; without it
    # the API refuses the upload and this job goes red on every merge. A red main nobody can clear
    # from the repository is the check people learn to ignore — the same argument as at the top of
    # this file — so the job reports and does not block. Turn it on at
    # Settings → Code security → Dependency graph and the snapshot starts landing for real.
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' because the action's default list still contains the retired "tools"
      # package, which sdkmanager now refuses. The runner image already ships platform-tools.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # Resolves every configuration and reports what it found to GitHub, which is what turns on
      # Dependabot alerts for this project's libraries and gives the review above its baseline.
      - name: Generate and submit the snapshot
        uses: gradle/actions/dependency-submission@v4

# There is deliberately no third-party vulnerability scanner here. Trivy and its peers are used
# through an action pinned to a version tag, and a tag that does not exist fails the workflow
# before it scans anything — which is what happened to the first attempt. The advisories for
# these libraries come from GitHub's own Dependabot alerts, computed server-side from the
# snapshot the job above submits, so there is nothing to pin and nothing to keep up to date.
