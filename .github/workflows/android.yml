name: Android

# The project's only CI. It builds when a pull request is merged into main, and on manual dispatch;
# ordinary pushes and open pull requests start nothing. A merge:
#  - runs the unit tests and Android Lint, and builds the signed release APK (plus the AAB);
#  - replaces the rolling "nightly" pre-release with this build;
#  - publishes a stable release v<appVersion> the first time a new appVersion (app/build.gradle.kts)
#    lands on main.
# Signing uses the repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD and the
# optional SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD. Without them the build fails: an unsigned or
# throwaway-signed APK could not update the app already installed on a phone.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# One build at a time, in order: a second merge queues behind the first rather than cancelling it,
# so every merge gets its own numbered build and the nightly always ends on the latest one.
concurrency:
  group: android-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The merge commit for a merged pull request, the dispatched commit otherwise. On a pull_request
  # event GITHUB_SHA is GitHub's own test-merge ref, not what landed on main.
  BUILD_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

jobs:
  build:
    name: Test, lint and assemble
    # "closed" also fires for a pull request that was abandoned; only a merge builds.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The run number is the version code, so every build installs over the previous one.
      VERSION_CODE: ${{ github.run_number }}
    outputs:
      version: ${{ steps.version.outputs.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' because the action's default list still contains the retired "tools"
      # package, which sdkmanager now refuses. The runner image already ships platform-tools.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The key lives in repository secrets, never in the repository: read access to the code must
      # not be enough to build an update for an installed app.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set. See \"Signing\" in the README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.bin"
          # A JKS file starts with the magic feedfeed; a PKCS#12 one is DER, starting with 30 82.
          # The extension is what tells Gradle which of the two it is.
          MAGIC="$(head -c 4 "$RUNNER_TEMP/keystore.bin" | od -An -tx1 | tr -d ' \n')"
          if [ "$MAGIC" = "feedfeed" ]; then
            mv "$RUNNER_TEMP/keystore.bin" "$RUNNER_TEMP/signing.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          else
            mv "$RUNNER_TEMP/keystore.bin" "$RUNNER_TEMP/signing.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
          fi

      # Integration tests skip themselves here (no database servers in CI); they are run locally.
      - name: Unit tests, lint and release build
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP"/signing.* "$RUNNER_TEMP/keystore.bin"

      # Prints the signer certificate, not the key: every build must carry the same certificate,
      # which is what lets a newer APK install over an older one.
      - name: Show the signing certificate
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -i "SHA-256 digest"

      - name: Read the version
        id: version
        run: |
          name=$(sed -n 's/^val appVersion = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$name" ]; then echo "::error::appVersion not found in app/build.gradle.kts"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/*.apk "sqlpulse-$name-${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/*.aab "sqlpulse-$name-${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: sqlpulse-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: |
            sqlpulse-*.apk
            sqlpulse-*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish nightly and release
    needs: build
    # A manual run on another branch builds, but never publishes over main's releases.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Full history and tags: the release notes list the commits since the previous v* tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sqlpulse-${{ needs.build.outputs.version }}-${{ github.run_number }}

      # The nightly is replaced, not added to: one rolling pre-release always holds the newest build.
      - name: Nightly
        run: |
          bash .github/scripts/release-notes.sh > notes.md
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly sqlpulse-*.apk --prerelease --target "$BUILD_SHA" \
            --title "Nightly ($VERSION, build ${{ github.run_number }})" --notes-file notes.md

      - name: Stable release on a new version
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already released"
            exit 0
          fi
          bash .github/scripts/release-notes.sh "$tag" > notes.md
          gh release create "$tag" sqlpulse-*.apk sqlpulse-*.aab --target "$BUILD_SHA" \
            --title "SQLPulse $VERSION" --notes-file notes.md
